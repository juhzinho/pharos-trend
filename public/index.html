<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pharos Trend</title>
  <meta name="description" content="Store each WPROS/USDC check and act only after a configurable run of at least 3 observations." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Newsreader:ital,opsz,wght@1,6..72,560&display=swap" rel="stylesheet" />
  <style>
    :root { --ink: #f3f6ff; --muted: #b7c0da; --blue: #8eb6ff; --coral: #ff8f7a; --mint: #7dE7c4; --line: rgba(255,255,255,.14); }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { color: var(--ink); background: #101626; font: 16px/1.5 Figtree, system-ui, sans-serif; }
    header { position: fixed; z-index: 3; top: 0; left: 0; right: 0; display: flex; align-items: center; padding: 18px 28px; }
    .brand { color: inherit; text-decoration: none; letter-spacing: .16em; font-size: 13px; font-weight: 700; }
    .brand b { color: var(--blue); }
    .lang { margin-left: auto; display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
    .lang button { border: 0; background: transparent; color: var(--muted); padding: 7px 12px; cursor: pointer; font: 700 12px Figtree, sans-serif; }
    .lang button.on { background: #f3f6ff; color: #172033; }
    main { position: relative; z-index: 2; min-height: 100vh; display: grid; grid-template-columns: 1fr .95fr; gap: 28px; align-items: center; padding: 88px 32px 28px; }
    .hero { max-width: 36rem; }
    .kicker { margin: 0 0 10px; letter-spacing: .18em; text-transform: uppercase; font-size: 12px; color: var(--blue); }
    h1 { margin: 0; font-family: Newsreader, Georgia, serif; font-weight: 560; font-style: italic; font-size: clamp(48px, 6vw, 80px); line-height: .92; }
    .lead { color: var(--muted); max-width: 46ch; }
    .rules { display: grid; gap: 8px; margin-top: 18px; }
    .rules span { border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px; color: var(--muted); background: rgba(16,22,38,.55); overflow-wrap: anywhere; }
    .dock { background: #182033; border: 1px solid var(--line); border-radius: 28px; padding: 16px; max-height: calc(100vh - 112px); display: flex; flex-direction: column; overflow: auto; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chips button, input, select, button { font: inherit; color: var(--ink); }
    .chips button { border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--muted); border-radius: 999px; padding: 8px 12px; cursor: pointer; }
    .chips button.on { color: #172033; background: var(--blue); border-color: transparent; }
    label { display: block; margin: 10px 0 4px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    input, select { width: 100%; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); background: rgba(8,12,22,.72); }
    .grid { display: grid; grid-template-columns: 1.3fr .7fr .8fr; gap: 8px; }
    .row { display: flex; gap: 8px; margin-top: 8px; }
    .btn { border: 0; border-radius: 999px; padding: 12px 16px; background: var(--blue); color: #172033; font-weight: 700; cursor: pointer; }
    .btn:disabled { opacity: .55; }
    .status { margin: 12px 0 0; min-height: 0; color: var(--muted); }
    .card { margin-top: 12px; }
    .card b { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
    .card.wait b { color: var(--coral); }
    .card.act b { color: var(--mint); }
    .card p { margin: 2px 0; }
    .detail { color: var(--muted); }
    .log-label { margin: 14px 0 0; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .history { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .check { border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px; }
    .check strong { display: block; }
    .check span, .check em { color: var(--muted); font-style: normal; }
    .check.spike { border-color: rgba(255,143,122,.75); }
    .check.spike em { color: var(--coral); }
    .check.lock { border-color: rgba(125,231,196,.75); }
    .check.lock em { color: var(--mint); }
    .check.step em { color: var(--blue); }
    @media (max-width: 900px) {
      header { padding: 12px 16px; }
      main { grid-template-columns: 1fr; align-items: start; padding: 64px 16px 16px; gap: 12px; }
      h1 { font-size: 36px; }
      .lead { margin: 6px 0 0; font-size: 15px; }
      .rules { margin-top: 8px; }
      .dock { order: -1; max-height: none; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/"><b>PHAROS</b> TREND</a>
    <div class="lang"><button type="button" data-lang="en">EN</button><button type="button" data-lang="pt">PT</button></div>
  </header>
  <main>
    <section class="hero">
      <p class="kicker" id="kicker"></p>
      <h1 id="title"></h1>
      <p class="lead" id="lead"></p>
      <div class="rules" id="rules"></div>
    </section>
    <section class="dock">
      <div class="chips" id="chips"></div>
      <form id="form">
        <div class="grid">
          <div>
            <label for="direction" id="directionL"></label>
            <select id="direction">
              <option value="down"></option>
              <option value="up"></option>
            </select>
          </div>
          <div>
            <label for="count" id="countL"></label>
            <input id="count" value="3" inputmode="numeric" />
          </div>
          <div>
            <label for="minutes" id="minutesL"></label>
            <input id="minutes" value="0" inputmode="numeric" />
          </div>
        </div>
        <div class="row"><button class="btn" id="go" type="submit"></button></div>
      </form>
      <p class="status" id="status"></p>
      <div id="out"></div>
      <p class="log-label" id="logLabel"></p>
      <div class="history" id="history"></div>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
